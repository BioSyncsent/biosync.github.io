<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to My Website</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      max-width: 480px;
      width: 100%;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background-color: #3b82f6;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.85rem;
      margin-bottom: 12px;
      color: #ffffff;
    }

    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
      font-size: 1rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      padding: 12px 20px;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn.secondary {
      background-color: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
    }

    .btn.secondary:hover {
      background-color: #334155;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Online</span>
    <h1>Site Under Construction</h1>
    <p>Welcome! This domain is connected and running. Content and updates are coming soon.</p>
    
    <div class="links">
      <a href="mailto:contact@yourdomain.com" class="btn">Get in Touch</a>
      <a href="https://github.com" class="btn secondary" target="_blank" rel="noopener noreferrer">View Projects</a>
    </div>
  </div>

</body>
</html>
